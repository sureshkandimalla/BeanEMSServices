spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Intellan?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect

# Extra allowed CORS origins beyond the localhost dev defaults baked into
# CorsConfig, e.g. the Vercel production URL — comma-separated, set at
# deploy time so adding an origin never needs a code change/rebuild.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:4000,http://localhost:4200}

spring.jpa.hibernate.ddl-auto=update
springdoc.swagger-ui.operationsSorter=method
spring.main.allow-bean-definition-overriding=true
spring.jpa.properties.hibernate.hbm2ddl.auto=update

spring.jpa.show-sql=false

# Format the SQL statements for readability
spring.jpa.properties.hibernate.format_sql=false

# Multipart file upload config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

